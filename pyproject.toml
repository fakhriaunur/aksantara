[project]
name = "aksantara"
version = "0.1.0"
description = "Aksantara KBBI-first fuel layer — canonical corpus, Vertex embeddings, Firestore vector search"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Aksantara" }]
dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "google-adk==2.8.0",
    "google-genai>=0.3.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-storage>=2.19.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio>=0.23.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["tests"]
ignore_errors = false

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.firestore"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.vertex"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.retrieve.semantic"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.api.routes"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/aksantara"]
