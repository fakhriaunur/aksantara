[project]
name = "aksantara"
version = "0.1.0"
description = "Aksantara KBBI-first fuel layer — canonical corpus, Vertex embeddings, Firestore vector search"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Aksantara" }]
dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "google-adk==2.8.0",
    "google-genai>=0.3.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-storage>=2.19.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "coverage[toml]>=7.6.0",
    "vulture>=2.9",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "RUF", "C"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
# Aksantara's router factory is currently the most complex function (40).
# This ceiling prevents further growth while the Phase 3 refactor extracts
# router and legacy-adapter helpers into focused modules.
max-complexity = 40

[tool.ruff.lint.per-file-ignores]
"src/aksantara/api/routes.py" = ["B008"]
"src/aksantara/embeddings/*" = ["B008", "E402", "E501", "F401", "F841", "RUF002", "RUF022", "RUF034"]
"scripts/release_embeddings.py" = ["B008", "C901", "E402", "E501", "F401", "F823", "RUF001", "RUF005", "RUF034"]
"src/aksantara/api/release_routes.py" = ["B008", "C901", "E501", "RUF001"]
"src/aksantara/projections/*" = ["B008", "B904", "E402", "E501", "RUF001", "RUF005"]
"scripts/generate_projection.py" = ["B008", "C901", "E402", "E501", "F401", "RUF001", "RUF005", "RUF034"]
"src/aksantara/api/projection_routes.py" = ["B008", "C901", "E501", "RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["tests"]
ignore_errors = false

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.firestore"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.firestore_types"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.firestore_utils"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.firestore_memory"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.firestore_client"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.planner"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.batch_store"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.work"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.release"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.metadata"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.cost"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.api.release_routes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.embeddings.vertex"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.retrieve.semantic"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.api.routes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.ingest.snapshots"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.projections.registry"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.projections.schemas"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.projections.generator"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.projections.manifest"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.projections.store"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aksantara.api.projection_routes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pythonjsonlogger.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = false

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\b",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.hatch.build.targets.wheel]
packages = ["src/aksantara"]
